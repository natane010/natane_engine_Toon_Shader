<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツール一覧 - Natane Toon Shader</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<header class="site-header"></header>

<div class="page-wrapper no-sidebar">
    <main class="main-content">

        <h1>エディタツール一覧</h1>
        <p class="page-subtitle">27以上の制作支援ツールを7つのカテゴリに分類しています。すべて Unity メニュー <code>Tools &gt; Natane</code> からアクセスできます。</p>

        <div id="tool-categories"></div>

    </main>
</div>

<footer class="site-footer">&copy; 2025 Natane Toon Shader.</footer>

<script src="../nav.js"></script>
<script>
(function() {
    var data = window.NataneNav;
    if (!data) return;
    var container = document.getElementById('tool-categories');
    var catDesc = {
        general:      'ダッシュボード、ヘルプなどの全般ツール',
        material:     'マテリアルの検証、編集、プレビュー、比較',
        preset:       'プリセットの閲覧、カラーパレット、生成',
        effect:       'シャドウ、MatCap、ディゾルブ、リムライトの調整',
        optimization: 'パフォーマンス、テクスチャ、アウトライン、屈折の最適化',
        migration:    'lilToon、一括変換、プレハブ変換',
        shader:       'シェーダーバリアント、ライトボリューム、UVテクスチャ'
    };
    var catIcons = {
        general: '🏠', material: '🎨', preset: '📦', effect: '✨',
        optimization: '⚡', migration: '🔄', shader: '🔧'
    };
    var catOrder = ['general', 'material', 'preset', 'effect', 'optimization', 'migration', 'shader'];

    catOrder.forEach(function(catKey) {
        var catInfo = data.TOOL_CATEGORIES[catKey];
        if (!catInfo) return;
        var tools = data.TOOL_ORDER.filter(function(t) { return t.cat === catKey; });
        if (tools.length === 0) return;

        var section = document.createElement('section');
        section.style.marginBottom = '32px';

        var h2 = document.createElement('h2');
        h2.textContent = (catIcons[catKey] || '') + ' ' + catInfo.label;
        section.appendChild(h2);

        var desc = document.createElement('p');
        desc.className = 'page-subtitle';
        desc.style.marginBottom = '16px';
        desc.textContent = catDesc[catKey] || '';
        section.appendChild(desc);

        var grid = document.createElement('div');
        grid.className = 'category-cards';
        tools.forEach(function(tool) {
            var a = document.createElement('a');
            a.className = 'category-card';
            a.href = tool.file;
            a.innerHTML = '<h3>' + tool.label + '</h3>';
            grid.appendChild(a);
        });
        section.appendChild(grid);
        container.appendChild(section);
    });
})();
</script>
</body>
</html>
